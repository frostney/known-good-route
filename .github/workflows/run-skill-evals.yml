name: Run skill evals

on:
  pull_request:
    types:
      - labeled
  workflow_dispatch:
    inputs:
      model:
        description: Model to evaluate
        required: true
        default: all
        type: choice
        options:
          - all
          - openai/gpt-5.6-sol
          - anthropic/claude-fable-5
          - anthropic/claude-opus-5
      case:
        description: Scenario to evaluate
        required: true
        default: all
        type: choice
        options:
          - all
          - create-pr-already-committed
          - update-pr-behind-main
          - issue-already-fixed
          - idea-materially-ambiguous
          - release-tag-owned-workflow
          - release-ownership-ambiguous
          - retrospective-selection-gate
          - small-change-no-verifier
          - unrelated-prompt-no-skill
      repeat:
        description: Repetitions per model and scenario
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "3"

permissions:
  contents: read

jobs:
  evaluate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.label.name == 'run-skill-evals')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Bun
        run: npm install --global bun@1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require AI Gateway key
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          if [ -z "$AI_GATEWAY_API_KEY" ]; then
            echo "::error::Add AI_GATEWAY_API_KEY as a repository Actions secret."
            exit 1
          fi

      - name: Run selected evals
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          EVAL_MODEL: ${{ inputs.model || 'all' }}
          EVAL_CASE: ${{ inputs.case || 'all' }}
          EVAL_REPEAT: ${{ inputs.repeat || '1' }}
        run: |
          args=(--repeat "$EVAL_REPEAT" --output .eval-results/ci-results.json)
          if [ "$EVAL_MODEL" != "all" ]; then
            args+=(--model "$EVAL_MODEL")
          fi
          if [ "$EVAL_CASE" != "all" ]; then
            args+=(--case "$EVAL_CASE")
          fi
          bun run eval -- "${args[@]}"

      - name: Upload raw eval results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: skill-eval-results-${{ github.run_id }}
          path: .eval-results/ci-results.json
          if-no-files-found: warn
          retention-days: 30
