name: Verify project AGENTS.md skills block

on:
  workflow_call:
    inputs:
      skills-root:
        description: Project root containing .agents/skills and AGENTS.md.
        required: false
        type: string
        default: "."

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out caller repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify the AGENTS.md skills block matches the installed skills
        uses: $/.github/actions/update-project-skills
        with:
          mode: verify-agents-block
          skills-root: ${{ inputs.skills-root }}
